name: Publicera Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
      - 'src/test/database-free.test.ts'
      - 'package.json'
      - 'bun.lock'
      - 'bun.lockb'
      - 'vitest.config.ts'
      - 'src/test/setup.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.WORKER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Kontrollera publiceringsbehörigheter
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! test -n "$CLOUDFLARE_API_TOKEN" || ! test -n "$CLOUDFLARE_ACCOUNT_ID"; then
            echo '::error::Lägg till CLOUDFLARE_API_TOKEN och CLOUDFLARE_ACCOUNT_ID i miljön cloudflare-worker.'
            exit 1
          fi
      - name: Kontrollera tjänstens säkerhetsregler
        run: bunx vitest run src/test/database-free.test.ts
      - name: Publicera separat live-API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: bunx --package wrangler@4.45.0 wrangler deploy --config worker/wrangler.toml