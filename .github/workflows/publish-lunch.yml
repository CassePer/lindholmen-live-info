name: Publicera lunchmenyer
on:
  schedule:
    # UTC: hourly, away from the busy hour boundary. Runner checks Stockholm hours.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      resume:
        description: 'Återuppta efter kontrollerad tjänsteåtkomst'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lunch-static-publishing
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.LUNCH_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Kontrollera behörigheter
        env:
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
        run: test -n "$LOVABLE_API_KEY"
      - name: Återställ privat jobbstatus
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun scripts/lunch/restore-state.ts
          if test -f .lunch-state/restore.zip; then
            unzip -p .lunch-state/restore.zip state.json > .lunch-state/state.json
          fi
      - name: Kör regressionstester
        run: bunx vitest run src/lib/static-lunch.test.ts src/test/database-free.test.ts src/lib/refresh-gate.test.ts
      - name: Hämta och validera menyer
        env:
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_MODE: ${{ vars.FIRECRAWL_MODE }}
          LUNCH_RESUME: ${{ github.event.inputs.resume }}
        run: bun scripts/lunch/run.ts
      - name: Bevara privat status även vid fel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunch-state
          path: .lunch-state/state.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Förbered offentlig menyfil
        uses: actions/upload-pages-artifact@v3
        with:
          path: static-data
  deploy:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicera validerad JSON
        id: deployment
        uses: actions/deploy-pages@v4